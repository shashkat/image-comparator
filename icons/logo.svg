<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- image-comparator logo: two decks of plots (folders) stepped through together -->
  <rect width="64" height="64" rx="14" fill="#1f4f86"/>
  <g fill="#fff">
    <!-- left deck -->
    <rect x="14" y="7" width="18" height="24" rx="3" opacity=".35"/>
    <rect x="11.5" y="10.5" width="18" height="24" rx="3" opacity=".6"/>
    <rect x="9" y="14" width="18" height="24" rx="3"/>
    <!-- right deck -->
    <rect x="40" y="7" width="18" height="24" rx="3" opacity=".35"/>
    <rect x="37.5" y="10.5" width="18" height="24" rx="3" opacity=".6"/>
    <rect x="35" y="14" width="18" height="24" rx="3"/>
  </g>
  <!-- bar chart -->
  <g fill="#2f6fb3">
    <rect x="12.5" y="26" width="3.2" height="8" rx=".8"/>
    <rect x="16.5" y="21" width="3.2" height="13" rx=".8"/>
    <rect x="20.5" y="29" width="3.2" height="5" rx=".8"/>
  </g>
  <!-- scatter plot -->
  <g fill="#e07b39">
    <circle cx="44" cy="27" r="1.6"/>
    <circle cx="41" cy="24" r="1.6"/>
    <circle cx="47" cy="24.5" r="1.6"/>
    <circle cx="41.5" cy="30" r="1.6"/>
    <circle cx="46.5" cy="30.5" r="1.6"/>
    <circle cx="44" cy="22" r="1.6"/>
    <circle cx="44" cy="32.5" r="1.6"/>
    <circle cx="39.5" cy="27" r="1.6"/>
    <circle cx="48.5" cy="27.5" r="1.6"/>
  </g>
  <!-- down arrow: all decks move to the next plot together -->
  <path d="M22 45 L32 55 L42 45" fill="none" stroke="#ffc94d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
